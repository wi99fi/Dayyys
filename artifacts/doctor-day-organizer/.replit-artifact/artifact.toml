kind = "mobile"
previewPath = "/"
title = "منظّم يوم الطبيب"
description = "تطبيق هاتف عربي يساعد الطبيب على تنظيم دوام المستشفى والمناوبات والعيادات والمهام والمشتريات، مع تقويم شهري ومزامنة سحابية خاصة."
version = "1.0.0"
id = "artifacts/doctor-day-organizer"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24900

[services.development]
run = "pnpm --filter @workspace/doctor-day-organizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doctor-day-organizer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/doctor-day-organizer", "run", "serve" ]

[services.env]
PORT = "24900"
BASE_PATH = "/"
